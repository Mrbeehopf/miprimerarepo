name: miprimerarepo
description: MotionSynth – Musik durch Bewegung und Audio entdecken
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Motion sensors
  sensors_plus: ^5.0.1

  # Audio recording
  record: ^5.1.2
  path_provider: ^2.1.3

  # FFT analysis
  fftea: ^2.1.1

  # Spotify OAuth2
  flutter_web_auth_2: ^3.1.0

  # HTTP client for Spotify API
  http: ^1.2.1

  # Open Spotify app via deep link
  url_launcher: ^6.3.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Token storage
  shared_preferences: ^2.3.2

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Cached network images for album art
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
